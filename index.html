  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .hidden-page { display: none; }

  .dish-card { transition: transform .3s ease, box-shadow .3s ease; }
  .dish-card:hover { transform: translateY(-2px); }

/* ===========================================================
   State
   =========================================================== */
const STATE = {
  locale: localStorage.getItem('aspire-locale') || 'en',
  route: (location.hash || '#home').replace('#',''),
  search: '',
  filters: new Set(),
  temperature: null,
  filtersOpen: false,
  order: [],     // [{dish, qty}]
  orderNote: '',
  orderStatus: 'idle',
  orderRef: null,
};

function t(key) { return (I18N[STATE.locale] && I18N[STATE.locale][key]) || I18N.en[key] || key; }
function setLocale(code) {
  STATE.locale = code;
  localStorage.setItem('aspire-locale', code);
  document.documentElement.lang = code;
  document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
  render();
}

const NAV_ITEMS = [
  { href:'menu', key:'nav.menu' },
  { href:'drinks', key:'nav.drinks' },
  { href:'dietary', key:'nav.dietary' },
  { href:'premium', key:'nav.premium' },
  { href:'about', key:'nav.about' },
  { href:'feedback', key:'nav.feedback' },
];

/* ===========================================================
   Helpers
   =========================================================== */
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id, cls='w-4 h-4') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

function image(src, alt, cls='') {
  return `<div class="relative overflow-hidden bg-ivory-200/60 ${cls}">
    <div class="absolute inset-0 skeleton"></div>
    <img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async"
      class="img-fade absolute inset-0 h-full w-full object-cover"
      onload="this.classList.add('loaded'); this.previousElementSibling && (this.previousElementSibling.style.display='none')" />
  </div>`;
}

/* ===========================================================
   Rendering: Header nav & language menu
   =========================================================== */
function renderHeader() {
  const desk = document.getElementById('desktopNav');
  const mob = document.getElementById('mobileNavList');
  desk.innerHTML = NAV_ITEMS.map(n => {
    const active = STATE.route === n.href;
    return `<a href="#${n.href}" data-route="${n.href}"
      class="relative pb-1 transition-colors ${active ? 'text-navy-900' : 'text-navy-500 hover:text-navy-900'}">
      ${esc(t(n.key))}
      ${active ? '<span class="absolute left-0 right-0 -bottom-0.5 h-px bg-gold-500"></span>' : ''}
    </a>`;
  }).join('');
  mob.innerHTML = NAV_ITEMS.map(n => {
    const active = STATE.route === n.href;
    return `<a href="#${n.href}" data-route="${n.href}"
      class="py-2 ${active ? 'text-navy-900' : 'text-navy-500'}">${esc(t(n.key))}</a>`;
  }).join('');

  const langMenu = document.getElementById('langMenu');
  langMenu.innerHTML = `
    <div class="px-4 py-2.5 swiss-eyebrow border-b border-ivory-200/60">${esc(t('lang.title'))}</div>
    <ul>
      ${LOCALES.map(l => `
        <li><button data-lang="${l.code}" class="w-full px-4 py-2.5 flex items-center justify-between hover:bg-ivory-100 transition-colors text-[0.9rem]">
          <span class="flex items-center gap-2">
            <span class="text-[0.75rem] uppercase tracking-wider text-navy-500 w-6">${l.code}</span>
            <span>${esc(l.native)}</span>
          </span>
          ${l.code === STATE.locale ? `<span class="text-gold-500">${icon('i-check','w-3.5 h-3.5')}</span>` : ''}
        </button></li>`).join('')}
    </ul>`;
  document.getElementById('langCurrent').textContent = STATE.locale.toUpperCase();

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
}

/* Menu */
function dishesFiltered() {
  const q = STATE.search.trim().toLowerCase();
  return DISHES.filter(d => {
    if (STATE.filters.size && ![...STATE.filters].every(f => d.dietary.includes(f))) return false;
    if (STATE.temperature && d.temperature !== STATE.temperature) return false;
    if (!q) return true;
    return d.name.toLowerCase().includes(q) || d.description.toLowerCase().includes(q);
  });
}

  const activeCount = STATE.filters.size + (STATE.temperature ? 1 : 0);
  const filterPanel = STATE.filtersOpen ? `
    <div class="mt-3 p-5 rounded-3xl bg-white border border-ivory-200/60 anim-up">
      <div class="flex items-center justify-between mb-3">
        <div class="swiss-eyebrow">${esc(t('menu.dietary'))}</div>
        ${activeCount ? `<button id="clearFilters" class="text-[0.72rem] uppercase tracking-wider text-navy-500 inline-flex items-center gap-1 hover:text-navy-900">${icon('i-x','w-3 h-3')} ${esc(t('menu.clear'))}</button>` : ''}

        <div class="swiss-eyebrow mb-3">${esc(t('menu.temperature'))}</div>

          ${['hot','cold'].map(temp => {
            const on = STATE.temperature === temp;
            const onColor = temp === 'hot' ? 'bg-[#C0481E]' : 'bg-[#2E7BB8]';

          }).join('')}
        </div>
      </div>
    </div>` : '';

  const filtered = dishesFiltered();
  const grouped = {};
  CATEGORIES.forEach(c => grouped[c.id] = []);
  filtered.forEach(d => grouped[d.category].push(d));

  const sections = CATEGORIES.map(cat => {
    const list = grouped[cat.id];
    if (!list.length && activeCount === 0 && !STATE.search) return '';
    return `
    <section id="cat-${cat.id}" class="scroll-mt-32">
      <div class="flex items-end justify-between mb-5">
        <div>
          <div class="swiss-eyebrow">— ${esc(t('menu.subtitle'))}</div>
          <h2 class="serif-heading text-3xl sm:text-4xl mt-1.5">${esc(t(cat.labelKey))}</h2>
        </div>
        <span class="text-[0.75rem] tracking-wider text-navy-500/70">${list.length} ${list.length === 1 ? 'dish' : 'dishes'}</span>
      </div>
      ${list.length === 0
        ? `<div class="rounded-3xl border border-dashed border-ivory-200 p-10 text-center text-navy-500">${esc(t('menu.empty'))}</div>`
        : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">${list.map(dishCard).join('')}</div>`}
    </section>`;
  }).join('');

  return `
  <section class="mx-auto max-w-6xl px-5 sm:px-8 pt-10 pb-6">
    <div class="swiss-eyebrow">— ${esc(t('menu.subtitle'))}</div>
    <h1 class="serif-heading text-4xl sm:text-5xl mt-2">${esc(t('menu.title'))}</h1>
  </section>

  <div class="mx-auto max-w-6xl px-5 sm:px-8">
    <div class="flex flex-col sm:flex-row gap-3">

/* Premium / order */
const STATUS_ORDER = ['pending','confirmed','preparing','ontheway','delivered'];

function etaMinutes() {
  return Math.min(22, 6 + STATE.order.reduce((a,i)=>a + i.qty*2, 0));
}

function orderAdd(id) {
  const dish = DISHES.find(d => d.id === id);
  if (!dish) return;
  const cur = STATE.order.find(i => i.dish.id === id);
  if (cur) cur.qty++; else STATE.order.push({ dish, qty: 1 });
  renderMain();
}
function orderRemove(id) {
  const idx = STATE.order.findIndex(i => i.dish.id === id);
  if (idx < 0) return;
  if (STATE.order[idx].qty > 1) STATE.order[idx].qty--;
  else STATE.order.splice(idx,1);
  renderMain();
}
function orderClear() { STATE.order = []; renderMain(); }
function orderPlace() {
  if (!STATE.order.length) return;
  STATE.orderRef = 'ASP-' + Math.random().toString(36).slice(2,7).toUpperCase();
  STATE.orderStatus = 'pending';
  showConfirmModal();
  const steps = ['confirmed','preparing','ontheway','delivered'];
  const delays = [900,2400,5200,8200];
  steps.forEach((s,i)=>{
    setTimeout(()=>{
      STATE.orderStatus = s;
      renderMain();
      const modal = document.getElementById('confirmModal');
      if (modal) showConfirmModal();
    }, delays[i]);
  });
  renderMain();
}

            ? `<span class="inline-flex items-center gap-1.5 rounded-full bg-white/95 px-2.5 py-1 text-[0.66rem] uppercase tracking-wider text-navy-900">${icon('i-swiss','w-3 h-3')} ${esc(t('menu.local'))}</span>`
            : `<span class="inline-flex items-center gap-1.5 rounded-full bg-white/95 px-2.5 py-1 text-[0.66rem] uppercase tracking-wider text-navy-500">${icon('i-globe','w-3 h-3')} ${esc(t('menu.international'))}</span>`}
          ${d.premium ? `<span class="inline-flex items-center gap-1 rounded-full bg-navy-900 text-gold-300 px-2.5 py-1 text-[0.66rem] uppercase tracking-wider">${icon('i-sparkle','w-3 h-3')} Suite</span>` : ''}
        </div>
      </div>
      <div class="p-6 overflow-y-auto">
        <div class="flex items-start justify-between gap-3">
          <h2 class="serif-heading text-3xl">${esc(d.name)}</h2>
          ${d.price ? `<span class="text-[0.95rem] tracking-wider text-gold-600">${esc(d.price)}</span>` : ''}
        </div>
        <p class="mt-3 text-[0.96rem] text-navy-500 leading-relaxed">${esc(d.description)}</p>
        ${d.chefNote ? `<div class="mt-5 rounded-2xl border border-gold-500/30 bg-gold-500/5 p-4">
          <div class="swiss-eyebrow mb-1.5">${esc(t('menu.chefnote'))}</div>
          <p class="text-[0.9rem] italic text-navy-700 leading-relaxed">${esc(d.chefNote)}</p>
        </div>` : ''}
        ${d.dietary.length ? `<div class="mt-5">
          <div class="swiss-eyebrow mb-2">${esc(t('menu.dietary'))}</div>
          <div class="flex flex-wrap gap-2">
            ${d.dietary.map(x=>`<span class="inline-flex items-center gap-1.5 rounded-full bg-sage-500/10 text-sage-500 px-3 py-1.5 text-[0.78rem]">${icon('d-'+x,'w-3.5 h-3.5')} ${esc(t('diet.'+x))}</span>`).join('')}
          </div>
        </div>` : ''}
        ${d.allergens.length ? `<div class="mt-5">
          <div class="swiss-eyebrow mb-2">${esc(t('menu.allergens'))}</div>
          <div class="flex flex-wrap gap-2">
            ${d.allergens.map(a=>`<span class="inline-flex items-center gap-1.5 rounded-full bg-ivory-200/60 px-3 py-1.5 text-[0.78rem] text-navy-700">${icon('a-'+a,'w-3.5 h-3.5')} ${esc(t('allergen.'+a))}</span>`).join('')}
          </div>
        </div>` : ''}
        ${d.premium ? `<button data-add="${d.id}" data-then-close class="mt-6 w-full inline-flex items-center justify-center gap-2 py-3.5 rounded-full bg-navy-900 text-ivory-50 uppercase tracking-wider text-[0.78rem] hover:opacity-90 transition-opacity">${icon('i-plus','w-3.5 h-3.5')} ${esc(t('menu.order'))}</button>` : ''}
      </div>
    </div>
  </div>`;
}

function showHelpModal() {
  document.body.style.overflow = 'hidden';
  document.getElementById('modalHost').innerHTML = `
  <div id="helpModal" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center anim-fade" data-close>
    <div class="w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl shadow-lift overflow-hidden sm:m-5 anim-up">
      <div class="flex items-start justify-between p-5">
        <div>
          <div class="swiss-eyebrow">${esc(t('home.qr.title'))}</div>
          <h3 class="serif-heading text-2xl mt-1">${esc(t('help.title'))}</h3>
        </div>
        <button data-close class="h-9 w-9 rounded-full border border-ivory-200 flex items-center justify-center">${icon('i-x','w-3.5 h-3.5')}</button>
      </div>
      <p class="px-5 text-[0.95rem] text-navy-500 leading-relaxed">${esc(t('help.body'))}</p>
      <div class="p-5">
        <button id="callHost" class="w-full flex items-center justify-center gap-2 py-3.5 rounded-full bg-navy-900 text-ivory-50 uppercase tracking-wider text-[0.78rem] hover:opacity-90 transition-opacity">
          ${icon('i-bell','w-3.5 h-3.5')} ${esc(t('help.callstaff'))}
        </button>
      </div>
    </div>
  </div>`;
}

function showConfirmModal() {
  document.body.style.overflow = 'hidden';
  const idx = STATUS_ORDER.indexOf(STATE.orderStatus);
  document.getElementById('modalHost').innerHTML = `
  <div id="confirmModal" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center anim-fade" data-close>
    <div class="w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl shadow-lift overflow-hidden sm:m-5 anim-up">
      <div class="p-7 text-center">
        <div class="mx-auto h-14 w-14 rounded-full bg-gold-500/15 text-gold-600 flex items-center justify-center">${icon('i-check','w-7 h-7')}</div>
        <div class="swiss-eyebrow mt-4">${esc(t('premium.confirm.ref'))}</div>
        <div class="serif-heading text-3xl mt-1">${esc(STATE.orderRef || '')}</div>
        <h3 class="serif-heading text-2xl mt-4">${esc(t('premium.confirm.title'))}</h3>
        <p class="mt-2 text-[0.95rem] text-navy-500 leading-relaxed">${esc(t('premium.confirm.body'))}</p>
        <div class="mt-4 inline-flex items-center gap-2 rounded-full bg-ivory-100 px-4 py-2 text-[0.8rem] tracking-wider">
          ${esc(t('premium.confirm.eta'))} · <span class="text-gold-600">${etaMinutes()} ${esc(t('premium.minutes'))}</span>
        </div>
        <div class="mt-5 text-left">
          <div class="swiss-eyebrow mb-2">${esc(t('premium.status.'+STATE.orderStatus))}</div>
          <div class="h-1.5 rounded-full bg-ivory-200 overflow-hidden">
            <div class="h-full bg-gold-500 transition-all duration-700" style="width:${((idx+1)/STATUS_ORDER.length)*100}%"></div>
          </div>
        </div>
      </div>
      <button data-close class="w-full py-4 border-t border-ivory-200/60 uppercase tracking-wider text-[0.78rem]">${esc(t('menu.close'))}</button>
    </div>
  </div>`;
}

function closeModals() {
  document.getElementById('modalHost').innerHTML = '';
  document.body.style.overflow = '';
}

/* ===========================================================
   Routing & main render
   =========================================================== */
function renderMain() {
  const m = document.getElementById('main');
  let html = '';
  switch (STATE.route) {
    case 'menu':     html = pageMenu(); break;
    case 'drinks':   html = pageDrinks(); break;
    case 'dietary':  html = pageDietary(); break;
    case 'premium':  html = pagePremium(); break;
    case 'about':    html = pageAbout(); break;
    case 'feedback': html = pageFeedback(); break;
    default:         html = pageHome();
  }
  m.innerHTML = `<div class="page">${html}</div>`;
  attachPageEvents();
}

function render() {
  renderHeader();
  renderMain();
}

function attachPageEvents() {
  // Dish open
  document.querySelectorAll('[data-dish]').forEach(b => b.addEventListener('click', e => {
    showDishModal(b.getAttribute('data-dish'));
  }));
  // Premium add/remove
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    orderAdd(b.getAttribute('data-add'));
    if (b.hasAttribute('data-then-close')) closeModals();
  }));
  document.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => orderRemove(b.getAttribute('data-rm'))));
  const oc = document.getElementById('orderClear'); if (oc) oc.addEventListener('click', orderClear);
  const op = document.getElementById('orderPlace'); if (op) op.addEventListener('click', orderPlace);
  const on = document.getElementById('orderNote'); if (on) on.addEventListener('input', e => STATE.orderNote = e.target.value);

  // Menu filters
  const si = document.getElementById('searchInput');
  if (si) si.addEventListener('input', e => { STATE.search = e.target.value; renderMain(); requestAnimationFrame(()=>document.getElementById('searchInput').focus()); });
  const tf = document.getElementById('toggleFilters');
  if (tf) tf.addEventListener('click', () => { STATE.filtersOpen = !STATE.filtersOpen; renderMain(); });
  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
    const f = b.getAttribute('data-filter');
    if (STATE.filters.has(f)) STATE.filters.delete(f); else STATE.filters.add(f);
    renderMain();
  }));
  document.querySelectorAll('[data-temp]').forEach(b => b.addEventListener('click', () => {
    const v = b.getAttribute('data-temp');
    STATE.temperature = STATE.temperature === v ? null : v;
    renderMain();
  }));
  const cf = document.getElementById('clearFilters');
  if (cf) cf.addEventListener('click', () => { STATE.filters.clear(); STATE.temperature = null; renderMain(); });

  // Category jump
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById(b.getAttribute('data-jump'));
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 110;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }));

  // Feedback stars
  document.querySelectorAll('[data-stars]').forEach(group => {
    const buttons = group.querySelectorAll('[data-star]');
    let value = 0;
    const paint = (v) => buttons.forEach((btn,i) => {
      const path = btn.querySelector('svg');
      if (i < v) { path.setAttribute('fill', '#B89855'); path.setAttribute('stroke', '#B89855'); }
      else { path.setAttribute('fill', 'none'); path.setAttribute('stroke', 'currentColor'); }
    });
    buttons.forEach((btn,i) => btn.addEventListener('click', () => { value = i + 1; paint(value); }));
  });
  const ff = document.getElementById('feedbackForm');
  if (ff) ff.addEventListener('submit', (e) => {
    e.preventDefault();
    ff.outerHTML = `<div class="text-center anim-up py-10">
      <div class="mx-auto h-16 w-16 rounded-full bg-gold-500/15 text-gold-600 flex items-center justify-center">${icon('i-check','w-7 h-7')}</div>
      <h2 class="serif-heading text-3xl mt-5">${esc(t('feedback.thanks'))}</h2>
      <p class="mt-3 text-navy-500 leading-relaxed">${esc(t('footer.note'))}</p>
    </div>`;
  });
}

/* ===========================================================
   Global event wiring
   =========================================================== */
// Hash routing
window.addEventListener('hashchange', () => {
  STATE.route = (location.hash || '#home').replace('#','');
  STATE.filtersOpen = false;
  window.scrollTo({ top: 0 });
  render();
});
document.body.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-route]');
  if (a) {
    e.preventDefault();
    const r = a.getAttribute('data-route');
    location.hash = '#' + r;
  }
});

// Mobile menu
document.getElementById('mobileBtn').addEventListener('click', () => {
  document.getElementById('mobileNav').classList.toggle('hidden');
});
document.getElementById('mobileNav').addEventListener('click', () => {
  document.getElementById('mobileNav').classList.add('hidden');
});

// Language menu
const langBtn = document.getElementById('langBtn');
const langMenu = document.getElementById('langMenu');
langBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  langMenu.classList.toggle('hidden');
});
document.addEventListener('click', (e) => {
  if (!document.getElementById('langWrap').contains(e.target)) langMenu.classList.add('hidden');
});
langMenu.addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]');
  if (b) { setLocale(b.getAttribute('data-lang')); langMenu.classList.add('hidden'); }
});

// Help
document.getElementById('helpBtn').addEventListener('click', showHelpModal);

// Modal close + call host (delegated)
document.getElementById('modalHost').addEventListener('click', (e) => {
  const callBtn = e.target.closest('#callHost');
  if (callBtn) {
    callBtn.outerHTML = `
      <div class="flex items-center justify-center gap-2 py-3.5 rounded-full bg-gold-500/10 text-gold-600 uppercase tracking-wider text-[0.78rem]">
        ${icon('i-check','w-3.5 h-3.5')} ${esc(t('help.called'))}
      </div>`;
    setTimeout(closeModals, 1800);
    return;
  }
  // Close on backdrop click (the outer [data-close] root) or on any explicit close button
  const isBackdrop = e.target.hasAttribute && e.target.hasAttribute('data-close');
  const closeBtn = e.target.closest('button[data-close]');
  if (isBackdrop || closeBtn) closeModals();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });

// init
document.documentElement.lang = STATE.locale;
document.documentElement.dir = STATE.locale === 'ar' ? 'rtl' : 'ltr';
render();
</script>
</body>
</html>
