<style>
  :root { --color-bg:#FBF9F5; --color-ink:#0A1729; --color-gold:#B89855; --color-mute:#8A8475; }
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { background: var(--color-bg); color: var(--color-ink); font-family: 'Inter', system-ui, sans-serif; font-weight: 300; letter-spacing: .005em; }
  [dir='rtl'] { text-align: right; }
  .hairline { background: linear-gradient(90deg, transparent, rgba(20,38,63,.18), transparent); height: 1px; }
  .swiss-eyebrow { font-family: 'Inter', sans-serif; font-weight: 400; font-size: .62rem; text-transform: uppercase; letter-spacing: .36em; color: #8A8475; }
  .serif-heading { font-family: 'Cormorant Garamond', serif; font-weight: 300; letter-spacing: -.012em; line-height: 1.05; }
  .card-glass { background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  ::selection { background: rgba(184,152,85,.2); color: #0A1729; }

  /* Aspire wordmark */
  .aspire-mark { font-family: 'Inter', sans-serif; font-weight: 800; letter-spacing: .22em; line-height: 1; }
  .aspire-sub { font-family: 'Inter', sans-serif; font-weight: 400; letter-spacing: .32em; line-height: 1; color: #8A8475; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(20,38,63,.15); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(20,38,63,.3); }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .img-fade { opacity: 0; transition: opacity .7s ease-out; }
  .img-fade.loaded { opacity: 1; }
  .skeleton { background: linear-gradient(90deg, #EDE6D6 0%, #F6F2EA 40%, #EDE6D6 80%); background-size: 800px 104px; animation: shimmer 2.4s infinite linear; }
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .lounge-input:focus { outline: none; border-color: #B89855; box-shadow: 0 0 0 3px rgba(184,152,85,.18); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .anim-fade { animation: fadeIn .5s ease-out both; }
  .anim-up { animation: fadeUp .7s ease-out both; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hidden-page { display: none; }
  .page { animation: fadeUp .55s ease-out both; }
  /* Dish card hover */
  .dish-card { transition: transform .3s ease, box-shadow .3s ease; }
  .dish-card:hover { transform: translateY(-2px); }
  /* Modal */
  .modal-bg { background: rgba(10,23,41,.4); backdrop-filter: blur(4px); }

  /* Immersive home */
  .hero-immersive { background: #FBF9F5; margin-top: -57px; padding-top: 57px; }
  .hero-glow { background: radial-gradient(70% 55% at 50% 70%, rgba(184,152,85,.18), rgba(184,152,85,0) 65%); }
  .hero-vignette { background: radial-gradient(95% 80% at 50% 35%, rgba(251,249,245,0), rgba(251,249,245,0.85)); }
  .hero-image-wrap { will-change: transform; transition: transform 0.9s cubic-bezier(.2,.8,.2,1); }
  @keyframes kenBurns {
    0% { transform: scale(1.04); }
    100% { transform: scale(1.10); }
  }
  .hero-image { animation: kenBurns 22s ease-in-out alternate infinite; transform-origin: 55% 60%; }

  /* Interactive buffet hotspots */
  .hotspot { position: absolute; transform: translate(-50%, -50%); cursor: pointer; background: transparent; border: 0; padding: 0; outline: none; }
  .hotspot-dot {
    position: relative; display: block; width: 12px; height: 12px; border-radius: 999px;
    background: #FBF9F5; box-shadow: 0 0 0 0 rgba(184,152,85,.55), 0 0 10px rgba(20,38,63,.35);
    animation: hotspotPulse 2.6s infinite ease-out;
  }
  .hotspot-dot::after {
    content: ''; position: absolute; inset: -7px; border-radius: 999px;
    border: 1px solid rgba(251,249,245,.7); transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s;
  }
  .hotspot:hover .hotspot-dot::after,
  .hotspot:focus-visible .hotspot-dot::after { transform: scale(1.55); border-color: rgba(184,152,85,.9); }
  .hotspot-card {
    position: absolute; left: 50%; bottom: calc(100% + 14px);
    transform: translate(-50%, 6px); transform-origin: bottom center;
    background: rgba(251,249,245,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(20,38,63,.08);
    padding: 14px 18px; min-width: 220px; max-width: 280px; text-align: left;
    opacity: 0; pointer-events: none;
    transition: opacity .4s cubic-bezier(.2,.8,.2,1), transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .hotspot-card::after {
    content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    width: 1px; height: 14px; background: rgba(184,152,85,.55);
  }
  .hotspot:hover .hotspot-card,
  .hotspot:focus-visible .hotspot-card,
  .hotspot.hotspot-open .hotspot-card { opacity: 1; transform: translate(-50%, 0); }
  .hotspot-eyebrow { display: block; font-size: .56rem; letter-spacing: .3em; text-transform: uppercase; color: #8A8475; margin-bottom: 6px; font-weight: 500; }
  .hotspot-title { display: block; font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; color: #0A1729; line-height: 1.2; }
  .hotspot-desc { display: block; font-size: .76rem; color: rgba(36,59,92,.85); margin-top: 5px; line-height: 1.55; }
  /* Right-side hotspots anchor the card to the left so it doesn't clip */
  .hotspot[data-anchor="right"] .hotspot-card { left: auto; right: 50%; transform: translate(50%, 6px); }
  .hotspot[data-anchor="right"]:hover .hotspot-card,
  .hotspot[data-anchor="right"]:focus-visible .hotspot-card { transform: translate(50%, 0); }
  /* Lower hotspots flip the card above to below */
  .hotspot[data-flip="down"] .hotspot-card { bottom: auto; top: calc(100% + 14px); transform: translate(-50%, -6px); }
  .hotspot[data-flip="down"] .hotspot-card::after { top: auto; bottom: 100%; }
  .hotspot[data-flip="down"]:hover .hotspot-card,
  .hotspot[data-flip="down"]:focus-visible .hotspot-card { transform: translate(-50%, 0); }
  @keyframes hotspotPulse {
    0% { box-shadow: 0 0 0 0 rgba(184,152,85,.6), 0 0 10px rgba(20,38,63,.35); }
    60% { box-shadow: 0 0 0 18px rgba(184,152,85,0), 0 0 10px rgba(20,38,63,.35); }
    100% { box-shadow: 0 0 0 0 rgba(184,152,85,0), 0 0 10px rgba(20,38,63,.35); }
  }

  /* Site-wide scroll progress hairline */
  #scrollProgress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: linear-gradient(90deg, transparent, rgba(184,152,85,.9), rgba(184,152,85,.6)); z-index: 60; transition: width .12s linear; pointer-events: none; }

  /* Homepage section indicator dots */
  #sectionDots { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 14px; z-index: 35; }
  @media (min-width: 1024px) { #sectionDots.is-on { display: flex; } }
  .section-dot { display: block; padding: 6px; background: transparent; border: 0; cursor: pointer; }
  .section-dot span { display: block; width: 6px; height: 6px; border-radius: 999px; background: rgba(20,38,63,.25); transition: width .4s cubic-bezier(.2,.8,.2,1), background .3s; }
  .section-dot.active span { background: rgba(184,152,85,.95); width: 22px; }
  .section-dot:hover span { background: rgba(184,152,85,.7); }

  /* Partnership slider */
  .partner-track { display: grid; grid-template-areas: 'stack'; position: relative; }
  .partner-track > .partner-slide { grid-area: stack; opacity: 0; visibility: hidden; transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1); pointer-events: none; transform: translateY(14px); }
  .partner-track > .partner-slide.active { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); transition-delay: .12s; }
  .partner-dot { display: block; padding: 8px; background: transparent; border: 0; cursor: pointer; }
  .partner-dot span { display: block; width: 8px; height: 8px; border-radius: 999px; border: 1px solid rgba(20,38,63,.35); background: transparent; transition: all .35s cubic-bezier(.2,.8,.2,1); }
  .partner-dot.active span { background: rgba(184,152,85,.95); border-color: rgba(184,152,85,.95); transform: scale(1.25); }
  .partner-dot:hover span { border-color: rgba(184,152,85,.75); }

  /* Magnetic CTA */
  .magnetic { transition: transform .45s cubic-bezier(.2,.8,.2,1); }

  /* Header chameleon — transparent + light-on-dark while over the hero */
  #siteHeader.on-hero { background: transparent !important; border-bottom-color: transparent !important; }
  #siteHeader.on-hero .aspire-mark { color: #FBF9F5 !important; }
  #siteHeader.on-hero .aspire-sub { color: rgba(251,249,245,0.6) !important; }
  #siteHeader.on-hero #desktopNav a { color: rgba(251,249,245,0.75); }
  #siteHeader.on-hero #desktopNav a:hover,
  #siteHeader.on-hero #desktopNav a.text-navy-900 { color: #FBF9F5; }
  #siteHeader.on-hero #desktopNav a > span.bg-navy-900 { background: #FBF9F5; }
  #siteHeader.on-hero #langBtn,
  #siteHeader.on-hero #loungeBtn { color: #FBF9F5; border-color: rgba(251,249,245,0.3); }
  #siteHeader.on-hero #langBtn:hover,
  #siteHeader.on-hero #loungeBtn:hover { border-color: rgba(251,249,245,0.6); }
  #siteHeader.on-hero #mobileBtn { color: #FBF9F5; border-color: rgba(251,249,245,0.3); }

  /* Signature variant chooser (House Frites) */
  .frites-list { border-top: 1px solid rgba(20,38,63,.1); }
  .frites-choice {
    display: flex; align-items: baseline; gap: 18px; width: 100%;
    padding: 18px 0; background: transparent; border: 0;
    border-bottom: 1px solid rgba(20,38,63,.1); text-align: left; cursor: pointer;
    transition: padding-left .45s cubic-bezier(.2,.8,.2,1);
  }
  [dir='rtl'] .frites-choice { text-align: right; }
  .frites-choice:hover { padding-left: 10px; }
  [dir='rtl'] .frites-choice:hover { padding-left: 0; padding-right: 10px; }
  .frites-index { font-size: 0.64rem; letter-spacing: 0.32em; color: rgba(20,38,63,.4); width: 30px; transition: color .4s; }
  .frites-name { flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; line-height: 1; color: rgba(20,38,63,.55); transition: color .4s; }
  .frites-marker { display: block; width: 0; height: 1px; background: rgba(184,152,85,.95); transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .frites-choice.active .frites-index { color: rgba(184,152,85,.95); }
  .frites-choice.active .frites-name { color: #0A1729; }
  .frites-choice.active .frites-marker { width: 56px; }
  .frites-shift { position: absolute; inset: 0; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .55s cubic-bezier(.2,.8,.2,1), transform .55s cubic-bezier(.2,.8,.2,1); }
  .frites-shift.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .frites-stage { position: relative; background: linear-gradient(180deg, rgba(184,152,85,.06), rgba(255,255,255,0)); }
  .frites-bigtype {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic;
    font-size: clamp(2.6rem, 9vw, 7.5rem); letter-spacing: -0.02em; line-height: 1;
    color: rgba(20,38,63,.08); white-space: nowrap; text-align: center;
    opacity: 0; transform: scale(.96); pointer-events: none;
    transition: opacity .85s cubic-bezier(.2,.8,.2,1), transform 1.3s cubic-bezier(.2,.8,.2,1);
  }
  .frites-bigtype.active { opacity: 1; transform: scale(1); }
  .frites-photo {
    position: absolute; inset: 0; opacity: 0; transform: scale(1.07);
    transition: opacity 1s cubic-bezier(.2,.8,.2,1), transform 1.6s cubic-bezier(.2,.8,.2,1);
  }
  .frites-photo.active { opacity: 1; transform: scale(1); }

  /* Animated fries scene */
  .fries-rain { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fry {
    position: absolute; top: -80px; left: var(--x);
    width: 7px; height: 64px; border-radius: 2px;
    background: linear-gradient(180deg, #F2C97A 0%, #D9A858 50%, #B88240 100%);
    box-shadow:
      inset 0 -10px 0 rgba(120, 70, 30, .18),
      inset 0 2px 0 rgba(255, 220, 180, .45),
      inset -1px 0 0 rgba(0,0,0,.06);
    transform: translate3d(0,0,0) rotate(var(--r0));
    opacity: 0;
    animation: fryFall 2.6s cubic-bezier(.5, .1, .4, 1) var(--d) forwards;
  }
  @keyframes fryFall {
    0%   { transform: translate3d(0, 0, 0) rotate(var(--r0)); opacity: 0; }
    10%  { opacity: .95; }
    85%  { opacity: .9; }
    100% { transform: translate3d(var(--dx), 540px, 0) rotate(var(--r1)); opacity: 0; }
  }
  .fries-box { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 62%; max-width: 320px; filter: drop-shadow(0 14px 22px rgba(20,38,63,0.12)); }
  .fries-garnish-svg { opacity: 0; transition: opacity .6s cubic-bezier(.2,.8,.2,1); }
  .fries-garnish-svg.active { opacity: 1; transition-delay: .25s; }
  @keyframes fryFall {
    0%   { transform: translate3d(0, 0, 0) rotate(var(--r0)); opacity: 0; }
    10%  { opacity: .95; }
    85%  { opacity: .9; }
    100% { transform: translate3d(var(--dx), 420px, 0) rotate(var(--r1)); opacity: 0; }
  }
  @media (max-width: 640px) {
    .fry { height: 48px; width: 5px; }
    @keyframes fryFall {
      0%   { transform: translate3d(0, 0, 0) rotate(var(--r0)); opacity: 0; }
      10%  { opacity: .95; }
      85%  { opacity: .9; }
      100% { transform: translate3d(var(--dx), 280px, 0) rotate(var(--r1)); opacity: 0; }
    }
  }

  .scroll-cue { animation: scrollPulse 2.4s ease-in-out infinite; }
  @keyframes scrollPulse {
    0%,100% { opacity: .25; transform: translateY(0); }
    50% { opacity: .9; transform: translateY(6px); }
  }
  .reveal { opacity: 0; transform: translateY(48px); transition: opacity 1.1s cubic-bezier(.2,.8,.2,1), transform 1.1s cubic-bezier(.2,.8,.2,1); will-change: opacity, transform; }
  .reveal.revealed { opacity: 1; transform: translateY(0); }
  .reveal-img { clip-path: inset(100% 0 0 0); transition: clip-path 1.3s cubic-bezier(.2,.8,.2,1); will-change: clip-path; }
  .reveal-img.revealed { clip-path: inset(0 0 0 0); }
  .tilt-card { transition: transform .9s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; will-change: transform; }
  .tilt-card .tilt-inner { transform: translateZ(40px); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
  .parallax-soft { transition: transform .25s ease-out; will-change: transform; }
  .text-stroke { -webkit-text-stroke: 1px rgba(246,242,234,.4); color: transparent; }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal-img, .tilt-card, .parallax-soft { transition: none !important; transform: none !important; clip-path: none !important; opacity: 1 !important; }
    .scroll-cue { animation: none !important; }
  }

  /* ====== Pre-Arrival Dining experience ====== */
  .pa-tray-stack { perspective: 1400px; }
  .pa-tray-tier {
    position: relative;
    background: linear-gradient(180deg, #FBF9F5 0%, #F2ECDE 100%);
    border: 1px solid rgba(184,152,85,.28);
    border-radius: 14px;
    padding: 22px 26px 26px;
    box-shadow: 0 18px 40px -28px rgba(20,38,63,.35), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .6s;
  }
  .pa-tray-tier::before {
    content: '';
    position: absolute; left: 18px; right: 18px; top: -8px; height: 8px;
    background: linear-gradient(180deg, rgba(184,152,85,.55), rgba(184,152,85,.05));
    border-radius: 8px 8px 0 0; opacity: .7;
  }
  .pa-tray-tier::after {
    content: '';
    position: absolute; left: -8px; right: -8px; bottom: -10px; height: 10px;
    background: radial-gradient(60% 100% at 50% 0%, rgba(20,38,63,.18), transparent 70%);
    pointer-events: none;
  }
  .pa-tray-tier + .pa-tray-tier { margin-top: 22px; }
  .pa-tray-tier:hover { box-shadow: 0 22px 50px -22px rgba(20,38,63,.4), inset 0 1px 0 rgba(255,255,255,.8); }
  .pa-tier-label {
    position: absolute; top: 14px; right: 18px;
    font-family: 'Inter', sans-serif; font-size: .55rem; font-weight: 500;
    letter-spacing: .36em; text-transform: uppercase; color: #B89855;
  }
  .pa-tier-num {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
    color: rgba(20,38,63,.35); font-size: 1.1rem; line-height: 1;
  }
  .pa-dish-slot {
    border: 1px dashed rgba(20,38,63,.18);
    background: rgba(255,255,255,.55);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color .25s, background .25s, transform .25s;
  }
  .pa-dish-slot.filled { border-style: solid; border-color: rgba(184,152,85,.35); background: rgba(255,255,255,.85); }
  .pa-dish-slot.recommend { box-shadow: 0 0 0 2px rgba(184,152,85,.18); }
  .pa-dish-slot:hover { transform: translateY(-1px); border-color: rgba(184,152,85,.6); }
  .pa-thumb {
    width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex: none;
    background: #EDE6D6;
  }
  .pa-size-card {
    border: 1px solid rgba(20,38,63,.12);
    background: #fff;
    padding: 22px 22px 24px;
    cursor: pointer;
    transition: border-color .3s, transform .3s, box-shadow .3s;
    position: relative;
  }
  .pa-size-card:hover { border-color: rgba(184,152,85,.55); transform: translateY(-2px); box-shadow: 0 18px 30px -22px rgba(20,38,63,.25); }
  .pa-size-card.active { border-color: #B89855; box-shadow: 0 0 0 2px rgba(184,152,85,.22), 0 22px 36px -24px rgba(20,38,63,.3); }
  .pa-size-card .pa-size-glyph {
    width: 56px; height: 56px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(184,152,85,.1); color: #B89855; margin-bottom: 14px;
  }
  .pa-pill {
    display:inline-flex; align-items:center; gap:6px;
    padding: 4px 9px; border-radius: 999px;
    font-size: .58rem; letter-spacing: .18em; text-transform: uppercase;
    background: rgba(184,152,85,.1); color: #9A7E3F;
  }
  .pa-pill.muted { background: rgba(20,38,63,.06); color: #15263F; }
  .pa-pill.allergen { background: rgba(217,52,43,.07); color: #B05A47; }
  .pa-swap-modal-card {
    background: #fff; max-height: 78vh; overflow-y: auto;
    border-radius: 14px; padding: 28px;
  }
  .pa-time-chip {
    padding: 10px 14px; border: 1px solid rgba(20,38,63,.15);
    font-size: .8rem; cursor: pointer; transition: all .25s;
    text-align: center; background: #fff;
  }
  .pa-time-chip.active { background: #15263F; color: #FBF9F5; border-color: #15263F; }
  .pa-time-chip:hover { border-color: #B89855; }
  .pa-status-dot {
    display:inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #7A8C73; box-shadow: 0 0 0 4px rgba(122,140,115,.18);
    animation: paPulse 2.2s infinite;
  }
  @keyframes paPulse { 0%,100%{box-shadow:0 0 0 4px rgba(122,140,115,.18);} 50%{box-shadow:0 0 0 8px rgba(122,140,115,.08);} }

function t(key) { return (I18N[STATE.locale] && I18N[STATE.locale][key]) || I18N.en[key] || key; }
function setLocale(code) {
  STATE.locale = code;
  localStorage.setItem('aspire-locale', code);
  document.documentElement.lang = code;
  document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
  render();
}

function activeLounge() {
  for (const region of LOUNGES) {
    for (const it of region.items) {
      if (it.id === STATE.activeLoungeId) return it;
    }
  }
  // Fall back to the first tiered lounge if state references something unknown
  for (const region of LOUNGES) {
    for (const it of region.items) {
      if (it.id && it.tier) return it;
    }
  }
  return null;
}
function activeTier() {
  const l = activeLounge();
  return (l && l.tier) || 'lifestyle';
}
function activeLoungeShortName() {
  const l = activeLounge();
  if (!l) return '';
  // Last segment after the last em-dash or middle dot, fallback to full name
  const parts = l.name.split(/\s+[—·]\s+/);
  return parts[parts.length - 1];
}
function setActiveLounge(id) {
  if (STATE.activeLoungeId === id) return;
  const prevTier = activeTier();
  STATE.activeLoungeId = id;
  localStorage.setItem('aspire-lounge', id);
  const newTier = activeTier();
  // Reset pre-arrival when the tier changes so we don't carry stale orders across experiences
  if (prevTier !== newTier) {
    STATE.preArrival.confirmed = null;
    STATE.preArrival.schedule = '';
    STATE.preArrival.note = '';
    STATE.preArrival.customizations = {};
    STATE.preArrival.dietaryPrefs = new Set();
    STATE.preArrival.suite = { pairing: null, delivery: 'table' };
    STATE.preArrival.prive = { nook: null, host: 'Élodie Roulet', hotTowel: true, chefNote: '' };
    if (typeof paApplySizeDefaults === 'function') paApplySizeDefaults(true);
  }
  // Drop off Pre-Arrival if the new lounge has no tier
  if (newTier === 'lifestyle' && STATE.route === 'pre-arrival') {
    location.hash = '#home';
    return; // hashchange will re-render
  }
  render();
}

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id, cls='w-4 h-4') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

function image(src, alt, cls='') {
  return `<div class="relative overflow-hidden bg-ivory-200/60 ${cls}">

      onload="this.classList.add('loaded'); this.previousElementSibling && (this.previousElementSibling.style.display='none')" />

}

function renderHeader() {
  const desk = document.getElementById('desktopNav');
  const mob = document.getElementById('mobileNavList');
  // Pre-Arrival is only available at lounges with a non-Lifestyle tier
  const navItems = NAV_ITEMS.filter(n => n.href !== 'pre-arrival' || activeTier() !== 'lifestyle');
  desk.innerHTML = navItems.map(n => {
    const active = STATE.route === n.href && !n.scroll;
    const scrollAttr = n.scroll ? ` data-scroll="${n.scroll}"` : '';
    return `<a href="#${n.href}" data-route="${n.href}"${scrollAttr}
      class="relative pb-1 text-[0.62rem] tracking-[0.32em] transition-colors ${active ? 'text-navy-900' : 'text-navy-500 hover:text-navy-900'}">
      ${esc(t(n.key))}
      ${active ? '<span class="absolute left-0 right-0 -bottom-0.5 h-px bg-navy-900"></span>' : ''}
    </a>`;
  }).join('');
  mob.innerHTML = navItems.map(n => {
    const active = STATE.route === n.href && !n.scroll;
    const scrollAttr = n.scroll ? ` data-scroll="${n.scroll}"` : '';
    return `<a href="#${n.href}" data-route="${n.href}"${scrollAttr}
      class="py-2 ${active ? 'text-navy-900' : 'text-navy-500'}">${esc(t(n.key))}</a>`;

  document.getElementById('langCurrent').textContent = STATE.locale.toUpperCase();

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));

  const lbl = document.getElementById('loungeBtnLabel');

function hotspot(left, top, title, desc, flip, anchor) {
  const flipAttr = flip === 'down' ? ' data-flip="down"' : '';
  const anchorAttr = anchor === 'right' ? ' data-anchor="right"' : '';
  return `
  <button class="hotspot" style="left:${left}%; top:${top}%;"${flipAttr}${anchorAttr} aria-label="${esc(title)}">
    <span class="hotspot-dot"></span>

}

/* Menu */
function dishesFiltered() {
  const q = STATE.search.trim().toLowerCase();
  return DISHES.filter(d => {
    if (STATE.filters.size && ![...STATE.filters].every(f => d.dietary.includes(f))) return false;
    if (STATE.temperature && d.temperature !== STATE.temperature) return false;
    if (!q) return true;
    const ld = localizedDish(d);
    return ld.name.toLowerCase().includes(q) || ld.description.toLowerCase().includes(q);
  });
}

function pageMenu() {
  const activeCount = STATE.filters.size + (STATE.temperature ? 1 : 0);
  const filterPanel = STATE.filtersOpen ? `
    <div class="mt-4 py-6 border-t border-b border-navy-900/10 anim-fade">
      <div class="flex items-center justify-between mb-3">
        <div class="swiss-eyebrow">${esc(t('menu.dietary'))}</div>
        ${activeCount ? `<button id="clearFilters" class="text-[0.7rem] uppercase tracking-[0.22em] text-navy-500 inline-flex items-center gap-1 hover:text-navy-900">${icon('i-x','w-3 h-3')} ${esc(t('menu.clear'))}</button>` : ''}
      </div>
      <div class="flex flex-wrap gap-2">
        ${DIETARY.map(f => {
          const on = STATE.filters.has(f);
          return `<button data-filter="${f}" class="inline-flex items-center gap-1.5 px-4 py-2 text-[0.78rem] transition-colors border ${on ? 'bg-navy-900 text-ivory-50 border-navy-900' : 'text-navy-700 border-navy-900/15 hover:border-navy-900/40'}">
            ${icon('d-'+f,'w-3.5 h-3.5')} ${esc(t('diet.'+f))}
          </button>`;
        }).join('')}
      </div>
      <div class="mt-6">
        <div class="swiss-eyebrow mb-3">${esc(t('menu.temperature'))}</div>
        <div class="flex flex-wrap gap-2">
          ${['hot','cold'].map(temp => {
            const on = STATE.temperature === temp;
            return `<button data-temp="${temp}" class="inline-flex items-center gap-1.5 px-4 py-2 text-[0.78rem] transition-colors border ${on ? 'bg-navy-900 text-ivory-50 border-navy-900' : 'text-navy-700 border-navy-900/15 hover:border-navy-900/40'}">
              ${icon(temp === 'hot' ? 'i-flame' : 'i-snow','w-3.5 h-3.5')} ${esc(t('menu.'+temp))}
            </button>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  const filtered = dishesFiltered();
  const grouped = {};
  CATEGORIES.forEach(c => grouped[c.id] = []);
  filtered.forEach(d => grouped[d.category].push(d));

  const sections = CATEGORIES.map(cat => {
    if (cat.id === 'drinks') {
      if (activeCount > 0 && !STATE.search) return '';
      const inner = renderDrinkSections(STATE.search);
      if (!inner) return '';
      return `
    <section id="cat-${cat.id}" class="scroll-mt-32 pt-12">
      ${categoryHeader(t(cat.labelKey))}
      <p class="mt-4 text-center text-navy-500 leading-[1.7] max-w-xl mx-auto">${esc(t('drinks.subtitle'))}</p>
      <div class="mt-12">${inner}</div>
    </section>`;
    }

    const list = grouped[cat.id];
    if (!list.length && activeCount === 0 && !STATE.search) return '';
    const local = list.filter(d => d.source === 'local');
    const international = list.filter(d => d.source === 'international');
    return `
    <section id="cat-${cat.id}" class="scroll-mt-32 pt-12 first:pt-0">
      ${categoryHeader(t(cat.labelKey))}
      ${list.length === 0
        ? `<div class="border-t border-navy-900/10 py-16 text-center text-[0.9rem] tracking-[0.22em] uppercase text-navy-500">${esc(t('menu.empty'))}</div>`
        : `
        ${local.length ? `
          <div class="mt-10">
            ${localSpecialityHeader()}
            <div class="mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-12">${local.map(dishCard).join('')}</div>
          </div>` : ''}
        ${local.length && international.length ? `<div class="hairline my-14 max-w-xl mx-auto"></div>` : ''}
        ${international.length ? `
          <div class="${!local.length ? 'mt-10' : ''}">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-12">${international.map(dishCard).join('')}</div>
          </div>` : ''}
      `}
    </section>`;
  }).join('');

  return `
  <section class="mx-auto max-w-6xl px-5 sm:px-8 pt-14 sm:pt-20 pb-8">
    <div class="swiss-eyebrow">— ${esc(t('menu.subtitle'))}</div>
    <h1 class="serif-heading text-[2.4rem] sm:text-[4rem] mt-3 text-navy-900">${esc(t('menu.title'))}</h1>
  </section>

  <div class="mx-auto max-w-6xl px-5 sm:px-8">
    <div class="flex flex-col sm:flex-row gap-3 border-t border-b border-navy-900/10 py-3">
      <div class="relative flex-1">
        <span class="absolute left-2 top-1/2 -translate-y-1/2 text-navy-500">${icon('i-search','w-4 h-4')}</span>
        <input id="searchInput" type="search" value="${esc(STATE.search)}" placeholder="${esc(t('menu.search'))}"
          class="lounge-input w-full h-11 pl-9 pr-4 bg-transparent border-0 text-[0.95rem] focus:ring-0" />
      </div>
      <button id="toggleFilters" class="h-11 px-5 inline-flex items-center gap-2 uppercase tracking-[0.22em] text-[0.7rem] transition-colors ${activeCount || STATE.filtersOpen ? 'text-navy-900' : 'text-navy-500 hover:text-navy-900'}">
        ${icon('i-sliders','w-3.5 h-3.5')} ${esc(t('menu.filters'))}
        ${activeCount ? `<span class="ml-1 text-navy-900">· ${activeCount}</span>` : ''}
      </button>
    </div>
    ${filterPanel}
  </div>

  <div class="sticky top-[57px] z-30 mt-6 bg-ivory-50/90 backdrop-blur-md border-b border-navy-900/10">
    <div class="mx-auto max-w-6xl px-5 sm:px-8">
      <div class="flex gap-8 overflow-x-auto scrollbar-hide py-3">
        ${CATEGORIES.map(c => `
          <button data-jump="cat-${c.id}" class="whitespace-nowrap text-[0.72rem] uppercase tracking-[0.28em] transition-all text-navy-500 hover:text-navy-900">
            ${esc(t(c.labelKey))}
          </button>`).join('')}
      </div>
    </div>
  </div>

  <div class="mx-auto max-w-6xl px-5 sm:px-8 py-12 space-y-16">${sections}</div>`;
}

function localizedDish(d) {
  const o = (DISH_I18N[STATE.locale] && DISH_I18N[STATE.locale][d.id]) || {};
  return {
    ...d,
    name: o.name || d.name,
    description: o.description || d.description,
    chefNote: o.chefNote || d.chefNote,
  };
}

function localizedDrink(section, idx) {
  const dict = (DRINK_I18N[STATE.locale] && DRINK_I18N[STATE.locale][section.key]) || {};
  const items = (dict.items && dict.items.length) ? dict.items : section.items;
  const item = items[idx] || section.items[idx];
  return item;
}
function localizedDrinkSection(section) {
  const dict = (DRINK_I18N[STATE.locale] && DRINK_I18N[STATE.locale][section.key]) || {};
  return {
    title: dict.title || section.title,
    items: (dict.items && dict.items.length) ? dict.items : section.items,
  };
}

function renderDrinkSections(query) {
  const q = (query || '').trim().toLowerCase();
  return DRINK_SECTIONS.map((s) => {
    const loc = localizedDrinkSection(s);
    const items = q
      ? loc.items.filter(it => it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q))
      : loc.items;
    if (!items.length) return '';
    return `
    <section class="grid grid-cols-1 md:grid-cols-12 gap-10 md:gap-14 items-center">
      <div class="md:col-span-7 ${s.reverse ? 'md:order-2' : ''}">
        <h2 class="serif-heading text-3xl sm:text-[2.6rem] text-navy-900">${esc(loc.title)}</h2>
        <div class="mt-8 space-y-6">
          ${items.map(it => `
            <div>
              <div class="flex items-baseline gap-3">
                <span class="text-[0.95rem] font-medium text-navy-900 tracking-tight">${esc(it.name)}</span>
                <span class="flex-1 border-b border-dotted border-navy-900/25 translate-y-[-3px]"></span>
              </div>
              <p class="mt-1.5 text-[0.85rem] text-navy-500 leading-relaxed max-w-md">${esc(it.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="md:col-span-5 ${s.reverse ? 'md:order-1' : ''}">
        <div class="relative aspect-[4/5] overflow-hidden">
          ${image(s.img, loc.title, 'h-full w-full')}
        </div>
      </div>
    </section>`;
  }).filter(Boolean).join('<div class="hairline my-16 sm:my-24"></div>');
}

/* ===========================================================
   Pre-Arrival Dining experience
   =========================================================== */
function paLuxeIsActive() {
  return activeTier() === 'luxe';
}

function paCanCustomize() {
  return activeTier() !== 'luxe';
}

function paIsPersonalized(dishId) {
  const c = STATE.preArrival.customizations[dishId];
  return c && c.removed && c.removed.length > 0;
}

function paApplyLuxeCombo() {
  const combo = PA_LUXE_COMBOS.find(c => c.id === STATE.preArrival.luxeCombo) || PA_LUXE_COMBOS[0];
  const cfg = PA_TRAY_SIZES[STATE.preArrival.size];
  STATE.preArrival.selections = {
    starters: combo.starters.slice(0, cfg.starters),
    mains:    combo.mains.slice(0, cfg.mains),
    desserts: combo.desserts.slice(0, cfg.desserts),
  };
  // Clear ingredient customizations — Luxe is locked
  STATE.preArrival.customizations = {};
}

function paApplySizeDefaults(force) {
  // Luxe always slots in whatever combo is active, scaled to the chosen size
  if (paLuxeIsActive()) {
    paApplyLuxeCombo();
    return;
  }
  const size = STATE.preArrival.size;
  const cfg = PA_TRAY_SIZES[size];
  const sel = STATE.preArrival.selections;
  ['starters','mains','desserts'].forEach(cat => {
    const count = cfg[cat];
    const current = sel[cat];
    if (force || current.length === 0) {
      sel[cat] = PA_RECOMMENDED[cat].slice(0, count);
    } else if (current.length > count) {
      sel[cat] = current.slice(0, count);
    } else if (current.length < count) {
      const fillers = PA_RECOMMENDED[cat].filter(id => !current.includes(id));
      while (current.length < count && fillers.length) current.push(fillers.shift());
    }
  });
}

function paTimeSlots() {
  const slots = [];
  const now = new Date();
  // Round up to next 15-minute boundary, then 6 slots at 30-min intervals
  const startMin = Math.ceil((now.getMinutes() + 1) / 15) * 15;
  const base = new Date(now);
  base.setMinutes(startMin, 0, 0);
  for (let i = 0; i < 6; i++) {
    const d = new Date(base.getTime() + i * 30 * 60 * 1000);
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    slots.push(`${hh}:${mm}`);
  }
  return slots;
}

function biteableDetail(id) {
  const d = DISHES.find(x => x.id === id);
  if (!d) return null;
  const overlay = BITEABLE_DETAIL[id] || {};
  return {
    ingredients: overlay.ingredients || [],
    portion: overlay.portion || '',
    provenance: overlay.provenance || '',
  };
}

function paIngredientTeaser(id) {
  const det = biteableDetail(id);
  if (!det || !det.ingredients.length) return '';
  return det.ingredients.slice(0, 3).join(' — ');
}

function paRefQrMarkup(ref) {
  if (typeof qrcode === 'undefined') return '<div class="pa-qr-host"></div>';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(`ASPIRE://pa/${ref}`);
    qr.make();
    const count = qr.getModuleCount();
    const size = 88;
    const cell = size / count;
    let rects = '';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="#0A1729"/>`;
        }
      }
    }
    return `<div class="pa-qr-host"><svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" shape-rendering="crispEdges">${rects}</svg></div>`;
  } catch (e) {
    return '<div class="pa-qr-host"></div>';
  }
}

// Heuristic — flag an ingredient as containing an allergen if its name mentions a keyword.
const PA_ALLERGEN_KEYWORDS = {
  gluten:    ['bread','pretzel','rolls','crispbread','sourdough','pastry','biscuit','sponge','wrap','wheat','granola','oat','genoise','meringue'],
  dairy:     ['butter','cream','crème','crema','yoghurt','yogurt','cheese','gruyère','tête de moine','hobelkäse','panna cotta','buttercream','milk'],
  nuts:      ['hazelnut','walnut','almond','pistachio','praline','nut'],
  shellfish: ['shrimp','prawn','crab','lobster','shellfish'],
  eggs:      ['egg','meringue','buttercream','sponge','genoise'],
  soy:       ['soy','soya','tofu','tamari'],
  sesame:    ['sesame','tahini'],
};

function paIngredientAllergens(ingredient, dishAllergens) {
  const lc = ingredient.toLowerCase();
  return dishAllergens.filter(a => {
    const kws = PA_ALLERGEN_KEYWORDS[a] || [];
    return kws.some(k => lc.includes(k));
  });
}

function paConfirmOrder() {
  const sel = STATE.preArrival.selections;
  const cfg = PA_TRAY_SIZES[STATE.preArrival.size];
  const expected = cfg.starters + cfg.mains + cfg.desserts;
  const filled = sel.starters.filter(Boolean).length + sel.mains.filter(Boolean).length + sel.desserts.filter(Boolean).length;
  if (filled !== expected) return;
  STATE.preArrival.confirmed = {
    time: STATE.preArrival.schedule || t('pa.now'),
    prep: paEffectivePrep(),
    ref: paGenerateRef(),
    tier: activeTier(),
    handoff: paHandoffCopy(),
  };
  renderMain();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderMain() {

  const m = document.getElementById('main');
  let html = '';
  switch (STATE.route) {
    case 'menu':        html = pageMenu(); break;
    case 'drinks':      html = pageDrinks(); break;
    case 'dietary':     html = pageDietary(); break;
    case 'partners':    html = pagePartners(); break;
    case 'about':       html = pageAbout(); break;
    case 'feedback':    html = pageFeedback(); break;
    case 'pre-arrival': html = activeTier() === 'lifestyle' ? pageHome() : pagePreArrival(); break;
    default:            html = pageHome();
  }
  m.innerHTML = `<div class="page">${html}</div>`;
  attachPageEvents();
  if (STATE.route === '' || STATE.route === 'home') {
    renderHomeQR();
    setupHomeImmersive();
  } else {

    setupRevealObserver();
  }
}

function renderHomeQR() {
  const host = document.getElementById('qrCanvas');
  if (!host || typeof qrcode === 'undefined') return;
  const url = window.location.href.split('#')[0];
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    // Build SVG manually for a refined look (rounded dots optional kept square for clarity)
    const count = qr.getModuleCount();
    const size = 260;
    const cell = size / count;
    let rects = '';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="#0A1729"/>`;
        }
      }
    }
    host.innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-label="QR code linking to this menu">${rects}</svg>`;
    const lbl = document.getElementById('qrUrlLabel');
    if (lbl) lbl.textContent = url.replace(/^https?:\/\//, '');
  } catch (e) {
    host.innerHTML = '<div class="text-[0.8rem] text-navy-500">QR generation unavailable.</div>';
  }
}

const IMMERSIVE = { raf: 0, running: false, cleanup: [] };

function teardownHomeImmersive() {
  IMMERSIVE.running = false;
  if (IMMERSIVE.raf) cancelAnimationFrame(IMMERSIVE.raf);
  IMMERSIVE.raf = 0;
  IMMERSIVE.cleanup.forEach(fn => { try { fn(); } catch(_){} });
  IMMERSIVE.cleanup = [];
}

function setupHomeImmersive() {
  IMMERSIVE.running = true;
  setupHotspotTouch();
  setupRevealObserver();
  setupTiltCards();
  setupParallax();

function setupHeaderChameleon() {
  const header = document.getElementById('siteHeader');
  const hero = document.getElementById('hero');
  if (!header || !hero) return;
  let raf = 0;
  function update() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const rect = hero.getBoundingClientRect();
      const onHero = rect.bottom > 80;
      header.classList.toggle('on-hero', onHero);
    });
  }
  update();
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  IMMERSIVE.cleanup.push(() => {
    cancelAnimationFrame(raf);
    window.removeEventListener('scroll', update);
    window.removeEventListener('resize', update);
    header.classList.remove('on-hero');
  });
}

function setupFritesChooser() {
  const root = document.getElementById('signature');
  if (!root) return;
  const buttons = root.querySelectorAll('.frites-choice');
  const groups = root.querySelectorAll('[data-variant]');
  if (!buttons.length) return;
  const N = 4;
  let active = 0, auto = 0;
  function go(i) {
    active = ((i % N) + N) % N;
    groups.forEach(el => el.classList.toggle('active', +el.dataset.variant === active));
    pourFries();
  }
  buttons.forEach(b => {
    b.addEventListener('click', () => { go(+b.dataset.variant); restart(); });
    b.addEventListener('mouseenter', () => { go(+b.dataset.variant); clearInterval(auto); });
    b.addEventListener('mouseleave', () => restart());
  });
  function restart() { clearInterval(auto); auto = setInterval(() => go(active + 1), 5500); }
  go(0); restart();
  IMMERSIVE.cleanup.push(() => clearInterval(auto));
}

function setupPartnerSlider() {
  const slides = document.querySelectorAll('#partnerTrack [data-slide]');
  const allDots = document.querySelectorAll('#partnerDots [data-jump], #partnerDotsMobile [data-jump]');
  if (!slides.length) return;
  let active = 0, auto = 0;
  function go(i) {
    active = ((i % slides.length) + slides.length) % slides.length;
    slides.forEach(s => s.classList.toggle('active', +s.dataset.slide === active));
    allDots.forEach(d => d.classList.toggle('active', +d.dataset.jump === active));
  }
  allDots.forEach(d => d.addEventListener('click', () => { go(+d.dataset.jump); restart(); }));
  function restart() { clearInterval(auto); auto = setInterval(() => go(active + 1), 9000); }
  go(0); restart();
  IMMERSIVE.cleanup.push(() => clearInterval(auto));
}

  nav.classList.add('is-on');
  const dots = nav.querySelectorAll('[data-dot]');

  dots.forEach(d => d.addEventListener('click', (e) => {
    e.preventDefault();
    const el = document.getElementById(d.dataset.dot);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 12;
    window.scrollTo({ top, behavior: 'smooth' });
  }));

  if (typeof IntersectionObserver === 'undefined') return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        dots.forEach(d => d.classList.toggle('active', d.dataset.dot === id));
      }
    });
  }, { threshold: 0.45, rootMargin: '-15% 0px -35% 0px' });
  sections.forEach(s => io.observe(document.getElementById(s.id)));
  IMMERSIVE.cleanup.push(() => {
    io.disconnect();
    nav.classList.remove('is-on');
    nav.innerHTML = '';
  });
}

function setupMagnetic() {
  const buttons = document.querySelectorAll('#main .magnetic');
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return; // touch devices
  buttons.forEach(btn => {
    let raf = 0;
    function onMove(e) {
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - (rect.left + rect.width/2);
      const y = e.clientY - (rect.top + rect.height/2);
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        btn.style.transform = `translate(${(x*0.18).toFixed(1)}px, ${(y*0.18).toFixed(1)}px)`;
      });
    }
    function onLeave() {
      cancelAnimationFrame(raf);
      btn.style.transform = '';
    }
    btn.addEventListener('mousemove', onMove);
    btn.addEventListener('mouseleave', onLeave);
    IMMERSIVE.cleanup.push(() => {
      btn.removeEventListener('mousemove', onMove);
      btn.removeEventListener('mouseleave', onLeave);
    });
  });
}

function setupScrollProgress() {
  const bar = document.getElementById('scrollProgress');
  if (!bar) return;
  let raf = 0;
  function update() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0;
      bar.style.width = pct + '%';
    });
  }
  update();
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
}

function setupHeroImageParallax() {
  const wrap = document.getElementById('heroImageWrap');
  if (!wrap) return;
  let mx = 0, my = 0, tmx = 0, tmy = 0;
  function onMove(e) {
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) / window.innerWidth - 0.5;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) / window.innerHeight - 0.5;
    tmx = cx; tmy = cy;
  }
  let raf = 0;
  function tick() {
    if (!IMMERSIVE.running) return;
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;
    const scrollY = Math.max(0, window.scrollY || 0);
    const k = Math.min(1, scrollY / (window.innerHeight || 1));
    const tx = (-mx * 26).toFixed(1);
    const ty = (-my * 18 - k * 60).toFixed(1);
    wrap.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
    raf = requestAnimationFrame(tick);
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: true });
  tick();
  IMMERSIVE.cleanup.push(() => {
    cancelAnimationFrame(raf);
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('touchmove', onMove);
  });
}

function setupHotspotTouch() {
  // On touch devices, toggle the active hotspot's card via click; close others.
  const spots = document.querySelectorAll('#main .hotspot');
  if (!spots.length) return;
  function onClick(e) {
    const s = e.currentTarget;
    spots.forEach(other => { if (other !== s) other.classList.remove('hotspot-open'); });
    s.classList.toggle('hotspot-open');
  }
  function onDocClick(e) {
    if (!e.target.closest('.hotspot')) spots.forEach(s => s.classList.remove('hotspot-open'));
  }
  spots.forEach(s => s.addEventListener('click', onClick));
  document.addEventListener('click', onDocClick);
  IMMERSIVE.cleanup.push(() => {
    spots.forEach(s => s.removeEventListener('click', onClick));
    document.removeEventListener('click', onDocClick);
  });
}

function setupHeroScene() {
  // Lightweight atmospheric dust layer over the buffet photograph.
  const canvas = document.getElementById('heroCanvas');
  if (!canvas || typeof THREE === 'undefined') return;
  const w = () => canvas.clientWidth;
  const h = () => canvas.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, w()/h(), 0.1, 30);
  camera.position.set(0, 0, 6);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(w(), h(), false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  // Champagne dust drifting in front of the image
  const N = 220;
  const pPos = new Float32Array(N * 3);
  const pSeed = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pPos[i*3]   = (Math.random() - 0.5) * 18;
    pPos[i*3+1] = (Math.random() - 0.5) * 10;
    pPos[i*3+2] = (Math.random() - 0.5) * 6;
    pSeed[i]    = Math.random() * Math.PI * 2;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ color: 0xD4B66A, size: 0.034, transparent: true, opacity: 0.55, depthWrite: false });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  let mx = 0, my = 0, tmx = 0, tmy = 0;
  function onMove(e) {
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) / window.innerWidth - 0.5;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) / window.innerHeight - 0.5;
    tmx = cx; tmy = cy;
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: true });

  function onResize() {
    camera.aspect = w()/h();
    camera.updateProjectionMatrix();
    renderer.setSize(w(), h(), false);
  }
  window.addEventListener('resize', onResize);

  let t = 0;
  function animate() {
    if (!IMMERSIVE.running) return;
    t += 0.005;
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;
    particles.rotation.y = t * 0.04;
    const dustPos = particles.geometry.attributes.position;
    for (let i = 0; i < N; i++) {
      const y = dustPos.getY(i) + 0.0016 + Math.sin(t * 0.9 + pSeed[i]) * 0.0005;
      dustPos.setY(i, y > 6 ? -6 : y);
    }
    dustPos.needsUpdate = true;
    camera.position.x = mx * 0.6;
    camera.position.y = -my * 0.3;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    IMMERSIVE.raf = requestAnimationFrame(animate);
  }
  animate();

  IMMERSIVE.cleanup.push(() => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('resize', onResize);
    pGeo.dispose(); pMat.dispose();
    renderer.dispose();
  });
}

function setupRevealObserver() {
  const els = document.querySelectorAll('#main .reveal');
  if (!els.length || typeof IntersectionObserver === 'undefined') {
    els.forEach(el => el.classList.add('revealed'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('revealed');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  els.forEach(el => io.observe(el));
  IMMERSIVE.cleanup.push(() => io.disconnect());
}

function setupTiltCards() {
  const cards = document.querySelectorAll('#main [data-tilt]');
  cards.forEach(card => {
    let raf = 0;
    function onMove(e) {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        card.style.transform = `perspective(1200px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg)`;
      });
    }
    function onLeave() {
      cancelAnimationFrame(raf);
      card.style.transform = '';
    }
    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);
    IMMERSIVE.cleanup.push(() => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
      cancelAnimationFrame(raf);
    });
  });
}

function setupParallax() {
  const layers = [
    { el: document.getElementById('parallaxBg1'), factor: 0.18 },
    { el: document.getElementById('parallaxBg2'), factor: 0.12 },
  ].filter(l => l.el);
  if (!layers.length) return;
  let raf = 0;
  function onScroll() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      layers.forEach(l => {
        const rect = l.el.getBoundingClientRect();
        const center = rect.top + rect.height / 2 - window.innerHeight / 2;
        l.el.style.transform = `translate3d(0, ${(-center * l.factor).toFixed(1)}px, 0)`;
      });
    });
  }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  IMMERSIVE.cleanup.push(() => {
    cancelAnimationFrame(raf);
    window.removeEventListener('scroll', onScroll);
    window.removeEventListener('resize', onScroll);
  });
}

function render() {
  renderHeader();
  renderMain();
}

function attachPageEvents() {
  // Dish open
  document.querySelectorAll('[data-dish]').forEach(b => b.addEventListener('click', e => {
    showDishModal(b.getAttribute('data-dish'));
  }));
  // Menu filters
  const si = document.getElementById('searchInput');
  if (si) si.addEventListener('input', e => { STATE.search = e.target.value; renderMain(); requestAnimationFrame(()=>document.getElementById('searchInput').focus()); });
  const tf = document.getElementById('toggleFilters');
  if (tf) tf.addEventListener('click', () => { STATE.filtersOpen = !STATE.filtersOpen; renderMain(); });
  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
    const f = b.getAttribute('data-filter');
    if (STATE.filters.has(f)) STATE.filters.delete(f); else STATE.filters.add(f);
    renderMain();
  }));
  document.querySelectorAll('[data-temp]').forEach(b => b.addEventListener('click', () => {
    const v = b.getAttribute('data-temp');
    STATE.temperature = STATE.temperature === v ? null : v;
    renderMain();
  }));
  const cf = document.getElementById('clearFilters');
  if (cf) cf.addEventListener('click', () => { STATE.filters.clear(); STATE.temperature = null; renderMain(); });

  // Category jump
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById(b.getAttribute('data-jump'));
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 110;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }));

  // Feedback stars
  document.querySelectorAll('[data-stars]').forEach(group => {
    const buttons = group.querySelectorAll('[data-star]');
    let value = 0;
    const paint = (v) => buttons.forEach((btn,i) => {
      const path = btn.querySelector('svg');
      if (i < v) { path.setAttribute('fill', '#0A1729'); path.setAttribute('stroke', '#0A1729'); }
      else { path.setAttribute('fill', 'none'); path.setAttribute('stroke', 'currentColor'); }
    });
    buttons.forEach((btn,i) => btn.addEventListener('click', () => { value = i + 1; paint(value); }));
  });
  // Pre-Arrival — tier is now derived from the active lounge; in-page tier picker removed
  const paChange = document.getElementById('paChangeLounge');
  if (paChange) paChange.addEventListener('click', showLoungePicker);
  document.querySelectorAll('[data-pa-combo]').forEach(b => b.addEventListener('click', () => {
    const id = b.getAttribute('data-pa-combo');
    if (STATE.preArrival.luxeCombo === id) return;
    STATE.preArrival.luxeCombo = id;
    paApplyLuxeCombo();
    renderMain();
  }));
  document.querySelectorAll('[data-pa-pref]').forEach(b => b.addEventListener('click', () => {
    const f = b.getAttribute('data-pa-pref');
    if (STATE.preArrival.dietaryPrefs.has(f)) STATE.preArrival.dietaryPrefs.delete(f);
    else STATE.preArrival.dietaryPrefs.add(f);
    renderMain();
  }));
  document.querySelectorAll('[data-pa-size]').forEach(b => b.addEventListener('click', () => {
    const s = b.getAttribute('data-pa-size');
    if (STATE.preArrival.size === s) return;
    STATE.preArrival.size = s;
    paApplySizeDefaults(false);
    renderMain();
  }));
  document.querySelectorAll('[data-pa-swap]').forEach(b => b.addEventListener('click', () => {
    if (!paCanCustomize()) return;  // safety — Luxe slots shouldn't render swap button
    const [cat, idxStr] = b.getAttribute('data-pa-swap').split(':');
    showPaSwapModal(cat, parseInt(idxStr, 10));
  }));
  document.querySelectorAll('[data-pa-detail]').forEach(b => b.addEventListener('click', () => {
    showBiteableModal(b.getAttribute('data-pa-detail'));
  }));
  document.querySelectorAll('[data-pa-pairing]').forEach(b => b.addEventListener('click', () => {
    const id = b.getAttribute('data-pa-pairing');
    STATE.preArrival.suite.pairing = STATE.preArrival.suite.pairing === id ? null : id;
    renderMain();
  }));
  document.querySelectorAll('[data-pa-delivery]').forEach(b => b.addEventListener('click', () => {
    STATE.preArrival.suite.delivery = b.getAttribute('data-pa-delivery');
    renderMain();
  }));
  document.querySelectorAll('[data-pa-nook]').forEach(b => b.addEventListener('click', () => {
    const id = b.getAttribute('data-pa-nook');
    STATE.preArrival.prive.nook = STATE.preArrival.prive.nook === id ? null : id;
    renderMain();
  }));
  document.querySelectorAll('[data-pa-time]').forEach(b => b.addEventListener('click', () => {
    const time = b.getAttribute('data-pa-time');
    STATE.preArrival.schedule = STATE.preArrival.schedule === time ? '' : time;
    renderMain();
  }));
  const paNote = document.getElementById('paNote');
  if (paNote) paNote.addEventListener('input', e => { STATE.preArrival.note = e.target.value; });
  const paPriveNote = document.getElementById('paPriveNote');
  if (paPriveNote) paPriveNote.addEventListener('input', e => { STATE.preArrival.prive.chefNote = e.target.value; });
  const paConfirmBtn = document.getElementById('paConfirmBtn');
  if (paConfirmBtn) paConfirmBtn.addEventListener('click', paConfirmOrder);
  const paReset = document.getElementById('paReset');
  if (paReset) paReset.addEventListener('click', () => {
    STATE.preArrival.confirmed = null;
    STATE.preArrival.schedule = '';
    STATE.preArrival.note = '';
    STATE.preArrival.suite.pairing = null;
    STATE.preArrival.prive.nook = null;
    STATE.preArrival.prive.chefNote = '';
    STATE.preArrival.customizations = {};
    STATE.preArrival.dietaryPrefs = new Set();
    paApplySizeDefaults(true);
    renderMain();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  const ff = document.getElementById('feedbackForm');
  if (ff) ff.addEventListener('submit', (e) => {
    e.preventDefault();
    ff.outerHTML = `<div class="anim-up py-10 border-t border-navy-900/10">
      <div class="swiss-eyebrow">— ${esc(t('feedback.submit'))}</div>
      <h2 class="serif-heading text-3xl sm:text-4xl mt-3 text-navy-900">${esc(t('feedback.thanks'))}</h2>
      <p class="mt-3 text-navy-500 leading-[1.7]">${esc(t('footer.note'))}</p>
    </div>`;
  });
}

/* ===========================================================
   Global event wiring
   =========================================================== */
// Hash routing
window.addEventListener('hashchange', () => {
  STATE.route = (location.hash || '#home').replace('#','');
  STATE.filtersOpen = false;
  window.scrollTo({ top: 0 });
  render();
});
document.body.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-route]');
  if (a) {
    e.preventDefault();
    const r = a.getAttribute('data-route');
    const scroll = a.getAttribute('data-scroll');
    const onHome = (location.hash.replace('#','') || 'home') === 'home';
    if (scroll) {
      const doScroll = () => {
        const el = document.getElementById(scroll);
        if (!el) return;
        const top = el.getBoundingClientRect().top + window.scrollY - 12;
        window.scrollTo({ top, behavior: 'smooth' });
      };
      if (onHome && r === 'home') {
        doScroll();
      } else {
        location.hash = '#' + r;
        setTimeout(doScroll, 260);
      }
    } else {
      location.hash = '#' + r;
    }
  }
});

// Mobile menu
document.getElementById('mobileBtn').addEventListener('click', () => {
  document.getElementById('mobileNav').classList.toggle('hidden');
});
document.getElementById('mobileNav').addEventListener('click', () => {
  document.getElementById('mobileNav').classList.add('hidden');
});

// Language menu
const langBtn = document.getElementById('langBtn');
const langMenu = document.getElementById('langMenu');
langBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  langMenu.classList.toggle('hidden');
});
document.addEventListener('click', (e) => {
  if (!document.getElementById('langWrap').contains(e.target)) langMenu.classList.add('hidden');
});
langMenu.addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]');
  if (b) { setLocale(b.getAttribute('data-lang')); langMenu.classList.add('hidden'); }
});

// Help
document.getElementById('helpBtn').addEventListener('click', showHelpModal);
const loungeBtnEl = document.getElementById('loungeBtn');
if (loungeBtnEl) loungeBtnEl.addEventListener('click', showLoungePicker);

// Modal close + call host (delegated)
document.getElementById('modalHost').addEventListener('click', (e) => {
  const callBtn = e.target.closest('#callHost');
  if (callBtn) {
    callBtn.outerHTML = `
      <div class="flex items-center justify-center gap-2 py-3.5 border border-navy-900/15 text-navy-700 uppercase tracking-[0.22em] text-[0.7rem]">
        ${icon('i-check','w-3.5 h-3.5')} ${esc(t('help.called'))}
      </div>`;
    setTimeout(closeModals, 1800);
    return;
  }
  // Close on backdrop click (the outer [data-close] root) or on any explicit close button
  const isBackdrop = e.target.hasAttribute && e.target.hasAttribute('data-close');
  const closeBtn = e.target.closest('button[data-close]');
  if (isBackdrop || closeBtn) closeModals();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });

// init
setupScrollProgress();
document.documentElement.lang = STATE.locale;
document.documentElement.dir = STATE.locale === 'ar' ? 'rtl' : 'ltr';
render();
</script>
