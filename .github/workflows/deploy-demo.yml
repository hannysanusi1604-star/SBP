name: Deploy demo to GitHub Pages

on:
  push:
    branches: [ "claude/vigilant-keller-2Lj1Q" ]
    paths:
      - "lifestyledemo_31.html"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

# Allow this workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # Serve the demo as the landing page for a clean URL...
          cp lifestyledemo_31.html _site/index.html
          # ...and also keep it reachable under its original filename.
          cp lifestyledemo_31.html _site/lifestyledemo_31.html
          # Skip Jekyll processing of the static file.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
